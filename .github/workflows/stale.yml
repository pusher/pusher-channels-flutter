name: Mark stale issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no activity
            for 90 days. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please leave a comment or update the issue.
          close-issue-message: >
            This issue has been closed due to inactivity. If the problem persists,
            please open a new issue with up-to-date details.
          exempt-issue-labels: 'bug,pinned,security'
          days-before-pr-stale: -1
          days-before-pr-close: -1
